<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tevfik Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <svg class="flame" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.5-5 3-6.5.3 2 1.2 3 2.3 3.5C14 10 15 6 16 2z" fill="currentColor"/><path d="M16 29a4 4 0 0 1-4-4c0-2 2-3.5 4-6 2 2.500 4 4 4 6a4 4 0 0 1-4 4z" fill="var(--bg)"/></svg>
    <div><h1>Tevfik Online School</h1><small>Management system</small></div>
  </div>
  <div class="ctl">
    <div class="seg" id="langSeg" data-notr role="group" aria-label="Language"><button data-lang="en" lang="en">English</button><button data-lang="tr" lang="tr">Türkçe</button><button data-lang="ug" lang="ug" dir="rtl">ئۇيغۇرچە</button></div>
    <div class="seg" id="roleSeg"></div>
    <select id="teacherSel" aria-label="Teacher"></select>
    <select id="monthSel" aria-label="Month"></select>
    <button id="syncBtn">Sync from Drive</button>
    <button id="themeBtn" aria-label="Toggle theme">Theme</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
</div>
<script src="js/config.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
<script src="js/google.js"></script>
<script src="js/students.js"></script>
<script src="js/sync.js"></script>
<script src="js/boot.js"></script>
<script src="js/i18n.js"></script>
</body>
</html>
